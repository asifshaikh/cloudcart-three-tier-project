name: CloudCart CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.prod.yaml'
      - 'scripts/deploy.sh'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcart-release
  cancel-in-progress: false

jobs:
  ci:
    name: CloudCart CI
    uses: ./.github/workflows/ci.yaml

  docker-push:
    name: CloudCart Docker Publish
    needs: ci
    uses: ./.github/workflows/docker-push.yaml
    secrets: inherit

  deploy:
    name: CloudCart Deploy EKS
    needs: docker-push
    uses: ./.github/workflows/cd-eks.yaml
    secrets: inherit
    with:
      image_tag: ${{ needs.docker-push.outputs.image_tag }}

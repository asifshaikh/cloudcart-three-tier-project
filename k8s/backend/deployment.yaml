apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cloudcart
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sekc69/cloudcart-backend:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: FLASK_PORT
              valueFrom:
                configMapKeyRef:
                  name: cloudcart-config
                  key: FLASK_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secrets
                  key: JWT_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

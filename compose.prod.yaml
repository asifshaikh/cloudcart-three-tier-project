services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cloudcart
      MYSQL_USER: cloudcart_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - cloudcart-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - cloudcart-internal

  db-init:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: 'no'
    env_file:
      - /opt/cloudcart/backend.env
    command: >
      sh -c "flask --app run init-db &&
             flask --app run seed-products"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudcart-internal

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    env_file:
      - /opt/cloudcart/backend.env
    expose:
      - '5000'
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cloudcart-internal

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cloudcart-internal

volumes:
  cloudcart-mysql-data:

networks:
  cloudcart-internal:
    driver: bridge

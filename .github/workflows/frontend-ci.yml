name: CloudCart Frontend CI

on:
  push:
    branches:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'main'
  pull_request:
    branches:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'main'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
